<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Зона роботи</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f9fafb; }
  #map { width: 100%; height: 100vh; }
  #controls {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 1000; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  }
  .btn {
    background: #fff; border: none; border-radius: 24px;
    padding: 10px 18px; font-size: 14px; font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18); cursor: pointer;
    display: flex; align-items: center; gap: 6px; color: #111827;
  }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn:active { opacity: 0.85; }
  #info {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: #fff; border-top-left-radius: 20px; border-top-right-radius: 20px;
    padding: 16px 20px 24px; z-index: 1000;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.12);
  }
  #info h3 { font-size: 16px; color: #111827; margin-bottom: 12px; }
  #address { font-size: 14px; color: #374151; margin-bottom: 12px; min-height: 18px; }
  .radius-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .r-chip {
    padding: 6px 14px; border-radius: 20px; border: 1.5px solid #e5e7eb;
    background: #f3f4f6; font-size: 13px; font-weight: 600; cursor: pointer; color: #374151;
  }
  .r-chip.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  #save-btn {
    width: 100%; padding: 14px; background: #2563eb; color: #fff;
    border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  #save-btn:active { opacity: 0.85; }
  .leaflet-control-attribution { display: none; }
</style>
</head>
<body>
<div id="map"></div>
<div id="controls">
  <button class="btn btn-primary" id="locate-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    Моє місцезнаходження
  </button>
</div>
<div id="info">
  <h3>📍 Зона роботи</h3>
  <div id="address">Натисніть на карту або визначте місцезнаходження</div>
  <div class="radius-row" id="radius-row"></div>
  <button id="save-btn">Зберегти зону</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const RADII = [5, 10, 15, 20, 30, 50, 100];
  let lat = 50.45, lng = 30.52, radius = 10;
  let marker, circle;

  // Read initial params from URL
  const params = new URLSearchParams(window.location.search);
  if (params.get('lat')) lat = parseFloat(params.get('lat'));
  if (params.get('lng')) lng = parseFloat(params.get('lng'));
  if (params.get('radius')) radius = parseInt(params.get('radius'));

  const map = L.map('map', { zoomControl: true }).setView([lat, lng], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
  }).addTo(map);

  const markerIcon = L.divIcon({
    className: '',
    html: `<div style="width:36px;height:36px;background:#2563eb;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
    </div>`,
    iconSize: [36, 36],
    iconAnchor: [18, 18],
  });

  function updateMap(newLat, newLng) {
    lat = newLat; lng = newLng;
    if (marker) map.removeLayer(marker);
    if (circle) map.removeLayer(circle);
    marker = L.marker([lat, lng], { icon: markerIcon, draggable: true }).addTo(map);
    circle = L.circle([lat, lng], {
      radius: radius * 1000,
      color: '#2563eb', fillColor: '#2563eb',
      fillOpacity: 0.12, weight: 2,
    }).addTo(map);
    marker.on('dragend', (e) => {
      const pos = e.target.getLatLng();
      updateMap(pos.lat, pos.lng);
      reverseGeocode(pos.lat, pos.lng);
    });
    // Fit map to circle bounds
    map.fitBounds(circle.getBounds(), { padding: [20, 20] });
    sendUpdate();
  }

  function updateRadius(r) {
    radius = r;
    document.querySelectorAll('.r-chip').forEach(c => c.classList.toggle('active', parseInt(c.dataset.r) === r));
    if (circle) {
      circle.setRadius(r * 1000);
      map.fitBounds(circle.getBounds(), { padding: [20, 20] });
    }
    sendUpdate();
  }

  function sendUpdate() {
    // Post message to parent React Native WebView / iframe
    const msg = JSON.stringify({ type: 'locationUpdate', lat, lng, radius });
    if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(msg);
    } else if (window.parent !== window) {
      window.parent.postMessage(msg, '*');
    }
  }

  async function reverseGeocode(lt, ln) {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lt}&lon=${ln}&format=json&accept-language=uk`);
      const data = await res.json();
      const addr = data.address;
      const city = addr.city || addr.town || addr.village || addr.county || '';
      const district = addr.suburb || addr.neighbourhood || '';
      document.getElementById('address').textContent = [city, district].filter(Boolean).join(', ') || data.display_name;
    } catch {
      document.getElementById('address').textContent = `${lt.toFixed(4)}, ${ln.toFixed(4)}`;
    }
  }

  // Build radius chips
  const rRow = document.getElementById('radius-row');
  RADII.forEach(r => {
    const chip = document.createElement('button');
    chip.className = 'r-chip' + (r === radius ? ' active' : '');
    chip.dataset.r = r;
    chip.textContent = r + ' км';
    chip.onclick = () => updateRadius(r);
    rRow.appendChild(chip);
  });

  // Map click
  map.on('click', (e) => {
    updateMap(e.latlng.lat, e.latlng.lng);
    reverseGeocode(e.latlng.lat, e.latlng.lng);
  });

  // Geolocation button
  document.getElementById('locate-btn').onclick = () => {
    if (!navigator.geolocation) {
      alert('Геолокація не підтримується вашим браузером');
      return;
    }
    document.getElementById('locate-btn').textContent = '⏳ Визначаємо...';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        document.getElementById('locate-btn').innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg> Моє місцезнаходження`;
        updateMap(pos.coords.latitude, pos.coords.longitude);
        reverseGeocode(pos.coords.latitude, pos.coords.longitude);
      },
      (err) => {
        document.getElementById('locate-btn').innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg> Моє місцезнаходження`;
        alert('Не вдалося визначити місцезнаходження. Перевірте дозволи браузера.');
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  // Save button
  document.getElementById('save-btn').onclick = () => {
    sendUpdate();
    if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'save', lat, lng, radius }));
    } else if (window.parent !== window) {
      window.parent.postMessage(JSON.stringify({ type: 'save', lat, lng, radius }), '*');
    }
  };

  // Initial render
  updateMap(lat, lng);
  reverseGeocode(lat, lng);
</script>
</body>
</html>
